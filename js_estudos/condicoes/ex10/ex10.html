<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Exercício</h1>

    <section>
        <div>
            Digite sua idade: <input type="number" name="txtidade" id="txtidade">
        </div>
        <div>
            <select id="tipo">
                <option value="">Escolha o ingresso</option>
                <option value="inteira">Inteira</option>
                <option value="meia">Meia</option>
                <option value="vip">VIP</option>
            </select>
        </div>

        <div>
            <input type="button" value="Verificar" onclick="verificar()">    
        </div>

        <div id="res">
            <h3>Preço dos ingressos</h3>
            <p>Inteira: R$ 40, qualquer idade</p>
            <p>Meia: R$ 20, é necessário ser menor de 18 anos ou maior que 60 anos</p>
            <p>VIP: R$ 100, qualquer idade</p>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
