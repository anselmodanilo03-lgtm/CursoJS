<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Exercício</h1>

    <section>
        <div>
            <input type="button" value="Verificar" onclick="verificar()">
        </div>

        <div id="res">
            
        </div>
    </section>
    <script>
        function verificar() {
            let resp = document.getElementById('res')
            
            let quantidade = Number(prompt('Quantas notas o aluno tirou?'))
            let total = 0

            for (let i = 1; i <= quantidade; i++) {
                let nota = Number(prompt(`Digite a ${i}ª nota:`))
                total += nota
            }

            let media = total / quantidade

            if (media >= 7) {
                resp.innerHTML = `Média: ${media.toFixed(1)} → <strong>Aprovado!</strong>`
            } 
            else if (media >= 5) {
                resp.innerHTML = `Média: ${media.toFixed(1)} → <strong>Em recuperação!</strong>`
            } 
            else {
                resp.innerHTML = `Média: ${media.toFixed(1)} → <strong>Reprovado</strong>`
            }
        }
    </script>
</body>
</html>
