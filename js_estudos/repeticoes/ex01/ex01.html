<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Exercício</h1>

    <section>
        <input type="button" value="Contagem" onclick="contagem()">

        <div id="res">  
            
        </div>
    </section>
    <script>


        function contagem() {
            let resp = document.getElementById('res')
            resp.innerHTML = ''
            
            for (let i = 10; i >= 1; i--) {
                resp.innerHTML += `${i} <br><br>`
            }
            resp.innerHTML += '<strong>FOGO!</strong>'
        }
    </script>
</body>
</html>
