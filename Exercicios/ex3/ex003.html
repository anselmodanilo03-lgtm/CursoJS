<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
    <style>
        div {
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Exercícios DOM</h1>
    <input type="number" name="n1" id="n1">
    <input type="button" value="Dobro" onclick="dobrar()">
    <div id="res" value="Dobrar">Aqui vai o resultado</div>
    <script>
        function dobrar() {
            var a = window.document.getElementById('n1')
            var s = Number(a.value)
            var dobro = s * 2
            res.innerHTML = `O dobro de ${s} é igual a ${dobro}`
        }
    </script>
</body>
</html>
