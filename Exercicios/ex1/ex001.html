<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
</head>
<body>
    <h1>Dobro e Triplo</h1>

    <script>
        var num = Number(window.prompt('Digite um número: '))
        var dobro = num * 2
        var triplo = num * 3
        var raiz = num ** 0.5
        document.write(`O dobro de ${num} é igual a ${dobro} <br>`)
        document.write(`O triplo de ${num} é igual a ${triplo} <br>`)
        document.write(`A raiz quadrada de ${num} é igual a ${raiz}`)
    </script>
</body>
</html>
