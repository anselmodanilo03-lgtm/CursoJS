<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
</head>
<body>
    <h1>Conversor de Temperatura</h1>
    
    <script>
        var temp = parseFloat(window.prompt('Quer converter qual temperatura de Celsius para Fahrenheit? '))
        var f = (temp * 9/5) + 32
        document.write(`A temperatura de ${temp}°C em Fahrenheit é igual a ${f.toFixed(1)}`)
    </script>
</body>
</html>
