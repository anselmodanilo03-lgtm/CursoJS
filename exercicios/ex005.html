<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
</head>
<body>
    <h1>Nome de usuário</h1>
    <input type="text" name="inome" id="inome">
    <input type="button" value="Enviar" onclick="mostrarNome()">
    <div id="res">Resultado...</div>

    <script>
        function mostrarNome() {
            var tn1 = window.document.getElementById('inome')
            var nome = tn1.value
            res.innerHTML = `Olá, ${nome}! Seja bem-vindo!`
        }
    </script>
</body>
</html>
