<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Maiúsculas, minúsculas e tamanho</h1>
    
    <script>
        let nome = window.prompt('Digite um nome: ')

        window.alert(`Seu nome em maiúsculas é ${nome.toUpperCase(nome)}`)
        window.alert(`Seu nome em minúsculas é ${nome.toLowerCase(nome)}`)
        window.alert(`Seu nome tem ${nome.length} letras`)
    </script>
</body>
</html>
