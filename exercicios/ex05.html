<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Valor em duas casas decimais e em formato de moeda</h1>

    <script>
        let numero = Number(window.prompt('Digite um número: '))

        window.alert(`O número ${numero} com duas casas decimais é ${numero.toFixed(2)}`)
        window.alert(`O número ${numero} em formato de moeda é ${numero.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}`)
    </script>
</body>
</html>
