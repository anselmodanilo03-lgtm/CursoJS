<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Dobro e metade</h1>
    
    <script>
        let n1 = Number(window.prompt('Digite um número'))
        let dobro = n1 * 2
        let metade = n1 / 2

        window.alert(`O número escolhido foi ${n1}, o dobro dele é ${dobro} e a metade é ${metade}`)
    </script>
</body>
</html>
