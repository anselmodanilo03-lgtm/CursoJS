<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora do Dia</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
        
        h1 {
            color: white;
            text-align: center;
        }

        #curso {
            color: white;
            text-align: center;
        }

        div {
            width: 400px;
            height: 280px;
            margin: auto;
            border: 1px solid rgba(0, 0, 0, 0.408);
            border-radius: 12px;
            box-shadow: 0px 0px 2px rgba(0, 0, 0, 0.559);
            background-color: white;
            text-align: center;
        }

        img {
            width: 200px;
            height: 200px;
            display: block;
            margin: auto;
            border: 1px solid black;
            border-radius: 100%;
        }
    </style>
</head>
<body>
    <h1>Hora do dia</h1>
    <div>
        <p>
            Agora são  horas
        </p>
        <img src="#" alt="Amanhecer do dia" id="imagem">
    </div>
    <p id="curso">© CursoemVideo</p>
    <script>
        var agora = new Date()
        var hora = agora.getHours()
        var corpo = window.document.body
        var foto = window.document.getElementById('imagem')
        if (hora >= 0 && hora < 6) {
            // Madrugada
            corpo.style.background = '#1B1F3B'
            foto.src = 'imagens/madrugada.jpg'
        } else if (hora < 12) {
            // Manhã
            corpo.style.background = '#FFDAB9'
            foto.src = 'imagens/amanhecer.jpg'
        } else if (hora < 18) {
            // Tarde
            corpo.style.background = '#B48370'
            foto.src = 'imagens/entardecer.jpg'
        } else {
            corpo.style.background = '#2C3E50'
            foto.src = 'imagens/noite.jpg'
            // Noite
        }
    </script>
</body>
</html>
